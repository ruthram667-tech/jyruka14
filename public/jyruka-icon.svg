<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- 3D Gold Gradient -->
    <linearGradient id="goldGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="20%" stop-color="#F3CA52" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997300" />
      <stop offset="90%" stop-color="#553A00" />
      <stop offset="100%" stop-color="#FFE885" />
    </linearGradient>

    <linearGradient id="goldRimIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E5B83B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3D2900" stop-opacity="0.9" />
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#iconBg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#3F3F46" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Emblem -->
  <g filter="url(#iconShadow)">
    <!-- Outer Arc -->
    <path
      d="M 50,14 A 36,36 0 1,0 79,34 L 69,40 A 24,24 0 1,1 50,26 A 24,24 0 0,1 68,34 L 78,24 A 36,36 0 0,0 50,14 Z"
      fill="url(#goldGradientIcon)"
    />
    <path
      d="M 50,15 A 35,35 0 0,0 18,50 A 35,35 0 0,0 50,85"
      stroke="url(#goldRimIcon)"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Handshake -->
    <g id="handshake-icon-core">
      <path d="M 28,57 L 37,45 L 43,50 L 33,63 Z" fill="url(#goldGradientIcon)" />
      <path d="M 36,46 C 40,42 45,42 49,44 L 58,52 C 59,53 58,55 56,56 L 51,60 C 50,61 49,61 48,60 L 40,53 Z" fill="url(#goldGradientIcon)" />
      <path d="M 72,47 L 62,59 L 56,54 L 66,41 Z" fill="url(#goldGradientIcon)" />
      <path d="M 63,58 C 59,62 54,62 50,60 L 43,53 C 42,52 43,50 45,49 L 51,45 C 52,43 55,44 56,45 L 62,52 Z" fill="url(#goldGradientIcon)" />

      <!-- Fingers -->
      <path d="M 47,48 L 53,54" stroke="#704D00" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 44,52 L 50,57" stroke="#704D00" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 42,55 L 47,60" stroke="#704D00" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <circle cx="48" cy="47" r="1.8" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>
</svg>
